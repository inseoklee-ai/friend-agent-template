# 도구 선택 평가를 돌려 기준에 못 미치면 실패로 끝낸다(평가 게이트).
# 실제 LLM 을 41번 부르므로 PR 마다 자동으로 돌리지 않는다. PR 에 eval 라벨을 붙였을 때나
# Actions 화면의 Run workflow 를 눌렀을 때만 돈다.
#
# 준비: 저장소 Settings > Secrets and variables > Actions 에 LLM_API_KEY 를 넣는다.
#       Variables 에 LLM_PROVIDER(openai 등)를 넣는다. 비우면 openai 로 본다.
#
# 기준은 지금 결과보다 조금 낮게 잡는다. 같은 코드로도 LLM 응답이 달라 정답 수가 한두 개 오르내린다.
# 2026-11-03 에 다섯 번씩 재 본 결과: 도구 정답 36~40, 도구와 인자 모두 정답 34~40.
name: eval

on:
  workflow_dispatch:
    inputs:
      min_tools:
        description: "도구 정답 최소 개수 (41개 중)"
        default: "36"
      min_args:
        description: "도구와 인자 모두 정답 최소 개수 (41개 중)"
        default: "33"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  eval:
    # eval 라벨을 붙였을 때만 돈다. 다른 라벨에는 돌지 않는다.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'eval'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: 도구 선택 평가
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Langfuse 키는 넣지 않는다. 키가 없으면 계측이 꺼지고 코드의 기본 프롬프트로 평가한다.
          # 코드 변경을 재는 게이트이므로 배포된 프롬프트가 아니라 코드의 문장이 맞다.
        run: |
          python scripts/eval_tools.py \
            --min-tools "${{ github.event.inputs.min_tools || '36' }}" \
            --min-args "${{ github.event.inputs.min_args || '33' }}"
